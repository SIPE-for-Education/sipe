<div>
  <h1 class="page-title">Feedback da Coordenação</h1>
  <div class="muted">
    Acompanhe o status dos planejamentos e avaliações enviados para
    análise.
  </div>
</div>
@if (selectedPlanning(); as planning) {
  <app-timeline-flow-banner [timelines]="planning?.timelines"></app-timeline-flow-banner>
}
<app-kpis [kpis]="kpis()"></app-kpis>

<div class="planning-container">
  <section class="box">
    <div class="section-content">
      <div class="box-header">
        <div class="section-title">
          <i class="bi bi-file-break-fill"></i>
          <span>Planejamentos Enviados</span>
        </div>

        <div class="filter-tabs">
          <button
            class="filter-tab"
            [class.active]="activePlanFilter() === 'all'"
            (click)="filterPlans('all')"
          >Todos</button>

          <button
            class="filter-tab"
            [class.active]="activePlanFilter() === 'pending'"
            (click)="filterPlans('pending')"
          >Ajustes</button>

          <button
            class="filter-tab"
            [class.active]="activePlanFilter() === 'approved'"
            (click)="filterPlans('approved')"
          >Aprovados</button>
        </div>
      </div>

      @for (plan of filteredPlans(); track plan.id) {
        <app-planning-card [plan]="plan" (click)="selectPlanning(plan.id)"></app-planning-card>
      }
    </div>
  </section>

  <aside class="detail-panel box" id="detailPanel">
    @if (selectedPlanning(); as planning) {
      <app-timeline [timelines]="planning?.timelines"></app-timeline>

      <app-revision-history [revisions]="planning?.revisions"></app-revision-history>

      @if (planning.status != "done") {
        <app-ai-box-suggestions [iaPrompt]="planning?.aiPrompt"
                                [aiSuggestions]="planning?.aiSuggestions"></app-ai-box-suggestions>
      }
    }

    <app-notification-card></app-notification-card>
  </aside>
</div>

<app-coordinator-modal [isOpen]="coordinatorModalOpen()" (closed)="closeCoordinatorModal()">
</app-coordinator-modal>

<div class="toast-container" id="toastContainer"></div>
