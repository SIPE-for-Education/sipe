<div>
  <h1 class="page-title">Biblioteca Inteligente</h1>
  <div class="muted">
    Base oficial utilizada pela IA para gerar planejamentos e
    avaliações.
  </div>
</div>

<app-kpis [kpis]="kpis()"></app-kpis>

<app-ai-flow-banner></app-ai-flow-banner>

<app-filters-bar></app-filters-bar>

<div class="library-content">
  <app-materials-grid
    [materials]="materials()"
    (materialSelected)="openDetailPanel($event)"
  ></app-materials-grid>

  <app-detail-panel
    [material]="selectedMaterial()"
    [isOpen]="detailPanelOpen()"
    (closed)="closeDetailPanel()"
  ></app-detail-panel>
</div>
