<header>
  <div class="left">
    <label for="school-selector"></label>
    <select id="school-selector" class="school-selector" (change)="handleSchoolChange()">
      <option value="cavlac">Colégio Cavlac</option>
      <option value="anglo">Colégio Anglo</option>
      <option value="estadual">E.E. Prof. Silva Neto</option>
    </select>

    <div class="system-chip purple-element">
      <i class="bi bi-building-fill"></i>
      <span>Sistema Anglo</span>
    </div>

    <div class="system-chip green-element">
      <i class="bi bi-calendar-check-fill"></i>
      <span>2026</span>
    </div>
  </div>

  <div class="right">
    <div class="team-information right-alignment">
      <span>Ano Letivo 2026</span>
      <div>2.º Bimestre · Semana 22</div>
    </div>

    <section class="actions">
      <button class="notification-button" (click)="toggleNotifPanel()">
        <i class="bi bi-bell-fill"></i>
        <div class="badge-orange">1</div>
      </button>

      <button class="modal-button" (click)="openAdminModal()">
        <i class="bi bi-gear-fill"></i>
        <span>Visualizar como Adminitrador</span>
      </button>

      <button class="modal-button" (click)="openCoordinatorModal()">
        <i class="bi bi-shield-lock-fill"></i>
        <span>Visualizar como Coordenador</span>
      </button>
    </section>

    <div class="user-profile">
      <div class="avatar">PE</div>
      <div class="team-information">
        <strong>Profª Elisabete</strong>
        <div>História · Geografia · Artes</div>
      </div>
    </div>
  </div>
</header>
