<section class="filters-bar">
  <div class="search-box">
    <i class="bi bi-search"></i>
    <label for="searchInput"></label>
    <input
      type="text"
      placeholder="Buscar materiais, competências, conteúdos..."
      id="searchInput"
      oninput="filterMaterials()"
    />
  </div>

  <div class="divider"></div>

  <div>
    <div class="label">Sistema</div>
    <label for="filterSistema"></label>
    <select
      class="filter-select"
      id="filterSistema"
      onchange="filterMaterials()"
    >
      <option value="">Todos</option>
      <option value="anglo">Anglo</option>
      <option value="objetivo">Objetivo</option>
      <option value="positivo">Positivo</option>
      <option value="sas">SAS</option>
    </select>
  </div>

  <div>
    <div class="label">Série</div>
    <label for="filterSerie"></label>
    <select
      class="filter-select"
      id="filterSerie"
      onchange="filterMaterials()"
    >
      <option value="">Todas</option>
      <option value="3ano">3º Ano</option>
      <option value="7ano">7º Ano</option>
      <option value="8ano">8º Ano</option>
      <option value="6ano">6º Ano</option>
    </select>
  </div>

  <div>
    <div class="label">Disciplina</div>
    <label for="filterDisc"></label>
    <select
      class="filter-select"
      id="filterDisc"
      onchange="filterMaterials()"
    >
      <option value="">Todas</option>
      <option value="mat">Matemática</option>
      <option value="hist">História</option>
      <option value="geo">Geografia</option>
      <option value="port">Português</option>
      <option value="arte">Artes</option>
    </select>
  </div>

  <div>
    <div class="label">Bimestre</div>
    <label for="filterBim"></label>
    <select
      class="filter-select"
      id="filterBim"
      onchange="filterMaterials()"
    >
      <option value="">Todos</option>
      <option value="1">1º</option>
      <option value="2">2º</option>
      <option value="3">3º</option>
      <option value="4">4º</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="view-toggle">
    <button
      class="view-button active"
      id="btnGrid"
      onclick="setView('grid')"
      title="Grade"
    >
      <i class="bi bi-columns-gap"></i>
    </button>

    <button
      class="view-button"
      id="btnList"
      onclick="setView('list')"
      title="Lista"
    >
      <i class="bi bi-grid-1x2"></i>
    </button>
  </div>
</section>
