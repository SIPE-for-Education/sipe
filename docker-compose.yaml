services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sipe-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sipe
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATA_DRIVER=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sipe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sipe-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - sipe-network

  mysql:
    image: mysql:8.4
    container_name: sipe-mysql
    environment:
      MYSQL_DATABASE: sipe
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sipe-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

networks:
  sipe-network:
    driver: bridge
